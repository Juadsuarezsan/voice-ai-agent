name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    env:
      WHISPER_BACKEND: stub
      TTS_BACKEND: stub
      VAD_BACKEND: energy
      LOGGER_BACKEND: memory
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy (strict)
        run: mypy --strict src/

      - name: Pytest with coverage gate
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Offline evaluation regenerates eval/RESULTS.md
        run: python -m eval.run --check

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
