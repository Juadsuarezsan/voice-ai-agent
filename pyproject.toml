[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "1.0.0"
description = "Voice AI conversational agent: VAD -> Whisper STT -> Claude reasoner -> TTS, orchestrated with LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Juan David Suárez Sánchez", email = "juadsuarezsan@unal.edu.co" }]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "tenacity==9.0.0",
    "loguru==0.7.2",
    "anthropic==0.125.0",
    "langgraph==0.2.45",
    "numpy==1.26.4",
    "psycopg[binary,pool]==3.2.3",
    "slowapi==0.1.9",
    "jiwer==3.0.5",
]

[project.optional-dependencies]
# Heavy audio stacks are opt-in: each one pulls torch (~2 GB with CUDA).
# The base install runs the full API with the deterministic stub backends.
stt = ["openai-whisper==20250625"]
vad = ["silero-vad==5.1.2"]
tts = ["coqui-tts==0.27.5"]
audio = ["voice-agent[stt,vad,tts]"]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "respx==0.21.1",
    "ruff==0.6.9",
    "black==24.10.0",
    "mypy==1.11.2",
    "nbformat==5.10.4",
    "nbclient==0.10.0",
    "ipykernel==6.29.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "(\\.venv|notebooks)"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["whisper", "whisper.*", "silero_vad", "silero_vad.*", "torch", "torch.*", "TTS", "TTS.*", "slowapi", "slowapi.*", "jiwer", "jiwer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = ["src/*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
